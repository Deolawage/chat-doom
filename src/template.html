<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chat Doom — A place to share your thoughts anonymously."
    />
    <title>Chat Doom</title>
  </head>

  <body>
    <main class="app-container">
      <header class="app-header">
        <h1>Chat Doom</h1>
      </header>

      <section class="composer-section">
        <form id="post-form">
         <!--<label for="post-content">What's on your mind?</label>-->

          <textarea
            id="post-content"
            name="post-content"
            placeholder="Share your thoughts... No one can know is You"
            rows="4"
            minlength="2"
            maxlength="500"
            required
          ></textarea>

          <div class="composer-footer">
            <span class="character-limit">Maximum 500 characters</span>

            <button type="submit" id="submit-post">
              Post
            </button>
          </div>
        </form>
      </section>

      <section class="timeline-section" aria-labelledby="timeline-heading">
        <h2 id="timeline-heading">Latest Thoughts</h2>

        <div id="post-timeline" aria-live="polite">
          <!-- Posts will be rendered here by JavaScript -->
        </div>
      </section>
    </main>
  </body>
</html>
